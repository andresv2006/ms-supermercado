spring.application.name=ms-pedido
server.port=${SERVER_PORT:8087}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ms_pedido}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:producto_super_secreto_especial123456789}
cliente.service.url=${CLIENTE_SERVICE_URL:http://localhost:8083/api/v1/clientes/}
producto.service.url=${PRODUCTO_SERVICE_URL:http://localhost:8084/api/v1/productos/}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
