    environment:
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_NAME: ms_auth
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: producto_super_secreto_especial123456789
      EUREKA_URL: http://ms-eureka:8761/eureka/
    depends_on:
      mysql-auth:
        condition: service_healthy
      ms-eureka:
        condition: service_started
    networks:
