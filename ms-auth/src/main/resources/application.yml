spring:
  application:
    name: ms-auth
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ms_auth}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:producto_super_secreto_especial123456789}
