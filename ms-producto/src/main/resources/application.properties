spring.application.name=ms-producto
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ms_producto}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:producto_super_secreto_especial123456789}
categoria.service.url=${CATEGORIA_SERVICE_URL:http://localhost:8082/api/v1/categorias/}

