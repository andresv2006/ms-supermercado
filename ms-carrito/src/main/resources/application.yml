spring:
  application:
    name: ms-carrito
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ms_carrito}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8086}

jwt:
  secret: ${JWT_SECRET:producto_super_secreto_especial123456789}

cliente:
  service:
    url: ${CLIENTE_SERVICE_URL:http://localhost:8083/api/v1/clientes/}

producto:
  service:
    url: ${PRODUCTO_SERVICE_URL:http://localhost:8084/api/v1/productos/}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  enable-hateoas: false


